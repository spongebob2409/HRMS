<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>HRMS Login</mat-card-title>
      <mat-card-subtitle>Human Resource Management System</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="username" placeholder="Enter username">
        <mat-icon matPrefix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="password">
        <mat-icon matPrefix>lock</mat-icon>
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword">
          <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>

      <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary" class="full-width"
        (click)="login()" [disabled]="loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
